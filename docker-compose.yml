services:
  # Este es el "Portero" (Nginx Global) que mencionamos
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-global.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build: ./Sakuraji-Api
    container_name: sakuraji-api
    # No exponemos puertos al Mac, Nginx los verá internamente
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost

  frontend:
    image: sakurajiwebapp # La que buildeaste antes
    container_name: sakuraji-webapp
    depends_on:
      - backend